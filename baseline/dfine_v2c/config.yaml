model_name: dfine_hgnetv2_s_v2c
pretrained_weights: ../../weights/dfine_s_coco.pth
num_classes: 4
num_queries: 100
ocr_sequence_length: 24

text_reference_offset_scale: 5.0
text_reference_jitter_scale: 0.2
text_first_layer_sampling_scale: 5.0
text_refine_sampling_scale: 0.5
ocr_guidance_num_heads: 4

dataset_root: ../../dataset
train_split: synthetic_train
val_split: synthetic_val
image_size: [540, 960]

device: auto
random_seed: 42
epochs: 200
batch_size: 4
workers: 0

learning_rate: 0.0001
backbone_learning_rate: 0.00001
resume_learning_rate: 0.0001
resume_backbone_learning_rate: 0.00001
weight_decay: 0.0001
max_grad_norm: 0.1

text_bbox_coef: 10.0
text_giou_coef: 4.0
text_fgl_coef: 0.15
text_ddf_coef: 1.5
locked_coef: 1.0
ctc_weight: 1.0

ctc_warmup_epochs: 5
ocr_gt_box_epochs: 50

entity_conf_threshold: 0.5
symbol_iou_threshold: 0.5
text_iou_threshold: 0.5
lock_threshold: 0.5

patience: 20
