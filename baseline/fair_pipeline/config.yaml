model_name: rtdetrv2_r18vd
pretrained_weights: ../../weights/rtdetrv2_r18vd_120e_coco.pth
num_symbol_classes: 4
num_text_classes: 1
num_queries: 100
ocr_sequence_length: 24

dataset_root: ../../dataset
train_split: synthetic_train
val_split: synthetic_val
test_split: synthetic_test
image_size: [540, 960]

device: auto
random_seed: 42
epochs: 200
batch_size: 4
workers: 0

learning_rate: 0.0001
backbone_learning_rate: 0.00001
resume_learning_rate: 0.0001
resume_backbone_learning_rate: 0.00001
weight_decay: 0.0001
max_grad_norm: 0.1

symbol_bbox_coef: 5.0
symbol_giou_coef: 2.0
text_bbox_coef: 10.0
text_giou_coef: 4.0
locked_coef: 1.0
ctc_weight: 1.0

ctc_warmup_epochs: 5
ocr_gt_box_epochs: 50
patience: 20

symbol_conf_threshold: 0.56
text_conf_threshold: 0.56
symbol_iou_threshold: 0.5
text_iou_threshold: 0.5
lock_threshold: 0.5
# 归一化距离门限，仅允许在验证集上调整。
association_max_distance: 0.03

symbol_best_checkpoint: symbol_best.pt
symbol_last_checkpoint: symbol_last.pt
text_best_checkpoint: text_best.pt
text_last_checkpoint: text_last.pt

efficiency_batch_size: 1
efficiency_warmup_iterations: 10
